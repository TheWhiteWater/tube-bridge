name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source boundary
        run: python scripts/check-public-tree.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact runtime dependencies
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Install project and test tooling
        run: |
          python -m pip install --no-deps .
          python -m pip install setuptools==83.0.0 wheel==0.47.0 pytest==9.0.2 pytest-asyncio==1.3.0 pytest-mock==3.15.1 build==1.5.0 twine==7.0.0
      - name: Frozen test suite
        run: python -m pytest tests -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
