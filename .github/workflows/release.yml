name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify public source boundary
        run: python scripts/check-public-tree.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if project["name"] != "tube-bridge":
              raise SystemExit(f"unexpected project identity: {project['name']!r}")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{project['version']}":
              raise SystemExit(f"tag {tag!r} does not match package version {project['version']!r}")
          PY
      - name: Install exact runtime dependencies
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Install project and exact release tooling
        run: |
          python -m pip install --no-deps .
          python -m pip install setuptools==83.0.0 wheel==0.47.0 pytest==9.0.2 pytest-asyncio==1.3.0 pytest-mock==3.15.1 build==1.5.0 twine==7.0.0
      - name: Frozen test suite
        run: python -m pytest tests -q
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          python - <<'PY'
          import email.parser
          import pathlib
          import tarfile
          import zipfile

          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          wheel_name = f"tube_bridge-{version}-py3-none-any.whl"
          sdist_name = f"tube_bridge-{version}.tar.gz"
          expected = {wheel_name, sdist_name}
          files = {path.name for path in pathlib.Path("dist").iterdir() if path.is_file()}
          if files != expected:
              raise SystemExit(f"unexpected release artifacts: {sorted(files)!r}")

          with zipfile.ZipFile(pathlib.Path("dist") / wheel_name) as archive:
              metadata = archive.read(f"tube_bridge-{version}.dist-info/METADATA").decode()
          wheel_meta = email.parser.Parser().parsestr(metadata)

          with tarfile.open(pathlib.Path("dist") / sdist_name, "r:gz") as archive:
              member = archive.extractfile(f"tube_bridge-{version}/PKG-INFO")
              if member is None:
                  raise SystemExit("sdist PKG-INFO is missing")
              sdist_meta = email.parser.Parser().parsestr(member.read().decode())

          for label, parsed in (("wheel", wheel_meta), ("sdist", sdist_meta)):
              if parsed["Name"] != "tube-bridge" or parsed["Version"] != version:
                  raise SystemExit(
                      f"{label} identity mismatch: {parsed['Name']!r} {parsed['Version']!r}"
                  )
          PY
      - name: Verify self-hosted-only artifact content
        run: python scripts/verify-release-artifacts.py dist/*
      - name: Build and verify Agent Plugin preview bundle
        run: |
          python scripts/build-agent-plugin.py --output-dir plugin-dist
          python scripts/verify-release-artifacts.py plugin-dist/*
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import zipfile

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          archive_path = pathlib.Path("plugin-dist") / f"tube-bridge-agent-plugin-{version}.zip"
          root = f"tube-bridge-agent-plugin-{version}"
          with zipfile.ZipFile(archive_path) as archive:
              names = set(archive.namelist())
              manifest = json.loads(archive.read(f"{root}/plugin.json"))
          required = {
              f"{root}/plugin.json",
              f"{root}/mcp.json",
              f"{root}/skills/tube-bridge-research/SKILL.md",
              f"{root}/tube_bridge/server.py",
              f"{root}/requirements-release.txt",
          }
          if not required <= names:
              raise SystemExit(f"Agent Plugin bundle is incomplete: {sorted(required - names)!r}")
          if manifest.get("version") != version:
              raise SystemExit("Agent Plugin bundle version mismatch")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-plugin-preview
          path: plugin-dist/
          if-no-files-found: error

  publish-pypi:
    # PyPI cannot be unpublished: wait until the container release is complete.
    needs: [verify-and-build, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for verified PyPI metadata
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          marker = "mcp-name: io.github.TheWhiteWater/tube-bridge"
          url = f"https://pypi.org/pypi/tube-bridge/{version}/json"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  if payload["info"]["version"] == version and marker in payload["info"]["description"]:
                      print(f"PyPI metadata for {version} is ready")
                      break
              except (KeyError, OSError, urllib.error.HTTPError, json.JSONDecodeError):
                  pass
              if attempt == 29:
                  raise SystemExit(f"PyPI metadata for {version} did not converge")
              time.sleep(10)
          PY
      - name: Install checksum-pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate to official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json

  verify-container:
    needs: verify-and-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/thewhitewater/tube-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build release candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          # Keep one plain manifest per platform; the index gate matches these digests exactly.
          provenance: false
          sbom: false
          tags: tube-bridge-release-candidate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Inspect release candidate image boundary
        run: |
          docker run --rm -i --entrypoint python tube-bridge-release-candidate:${{ github.sha }} - <<'PY'
          from pathlib import Path

          root = Path("/app")
          required = {
              "LICENSE", "README.md", "pyproject.toml",
              "requirements-release.txt", "tube_bridge",
          }
          names = {path.name for path in root.iterdir()}
          missing = required - names
          if missing:
              raise SystemExit(f"runtime image missing required paths: {sorted(missing)!r}")
          unexpected = names - required
          if unexpected:
              raise SystemExit(f"runtime image contains unexpected top-level paths: {sorted(unexpected)!r}")
          forbidden = {
              ".git", ".github", ".brainops", ".tme", ".hermes", "operator",
              "docs", "skills", "tests", "plugin.json", "mcp.json", "server.json",
              "server.py", "test_tools.py", "CONTRIBUTING.md", "SECURITY.md",
          }
          leaked = names & forbidden
          if leaked:
              raise SystemExit(f"runtime image contains repository-only paths: {sorted(leaked)!r}")

          import re
          secret_patterns = (
              re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(rb"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(rb"Bearer\s+[A-Za-z0-9._~+/-]{20,}", re.IGNORECASE),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"/home/[A-Za-z0-9._-]+/"),
              re.compile(rb"/Users/[A-Za-z0-9._-]+/"),
          )
          findings = []
          for path in root.rglob("*"):
              if not path.is_file() or "site-packages" in path.parts:
                  continue
              content = path.read_bytes()
              if any(pattern.search(content) for pattern in secret_patterns):
                  findings.append(str(path))
          if findings:
              raise SystemExit(f"runtime image secret/private-marker scan failed: {findings!r}")
          PY
      - name: Check installed dependency consistency
        run: docker run --rm --entrypoint python tube-bridge-release-candidate:${{ github.sha }} -m pip check
      - name: Exercise native inference, vector search, and frame codecs
        run: |
          docker run --rm -i --entrypoint python tube-bridge-release-candidate:${{ github.sha }} - "${{ matrix.arch }}" < scripts/smoke-container-runtime.py
      - name: Exercise health, authentication, and MCP protocol
        run: |
          set -euo pipefail
          container=$(docker run -d --rm \
            -e TUBE_BRIDGE_AUTH_KEY=release-smoke \
            -e TUBE_BRIDGE_CACHE=/tmp/tube-bridge-smoke \
            tube-bridge-release-candidate:${{ github.sha }})
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          docker exec -i "$container" python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for attempt in range(120):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
                      assert response.status == 200
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("container health check timed out")
          request = urllib.request.Request(
              "http://127.0.0.1:8080/mcp", data=b"{}",
              headers={"Content-Type": "application/json"}, method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          else:
              raise SystemExit("unauthenticated MCP request was accepted")
          PY
          docker exec -i "$container" python - --url http://127.0.0.1:8080/mcp --auth release-smoke < tests/mcp_client_smoke.py
      - name: Push inspected platform candidate and record immutable digest
        env:
          IMAGE: ghcr.io/thewhitewater/tube-bridge
          ARCH: ${{ matrix.arch }}
          CANDIDATE_ID: rc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ref="$IMAGE:$CANDIDATE_ID-$ARCH"
          docker tag tube-bridge-release-candidate:${{ github.sha }} "$ref"
          docker push "$ref"
          mkdir -p digests
          docker image inspect "$ref" --format '{{json .RepoDigests}}' > repo-digests.json
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          refs = json.loads(pathlib.Path("repo-digests.json").read_text())
          matches = [ref for ref in refs if re.fullmatch(re.escape(os.environ["IMAGE"]) + r"@sha256:[a-f0-9]{64}", ref)]
          if len(matches) != 1:
              raise SystemExit(f"expected one GHCR image digest, got {matches!r}")
          pathlib.Path("digests", os.environ["ARCH"] + ".txt").write_text(matches[0] + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error

  publish-container:
    needs: verify-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/thewhitewater/tube-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-digest-*
          merge-multiple: true
          path: digests
      - name: Assemble and inspect multi-platform candidate
        env:
          IMAGE: ghcr.io/thewhitewater/tube-bridge
          CANDIDATE_ID: rc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path("digests")
          if {p.name for p in root.iterdir()} != {"amd64.txt", "arm64.txt"}:
              raise SystemExit("expected exactly one digest for each platform")
          refs = [(root / f"{arch}.txt").read_text().strip() for arch in ("amd64", "arm64")]
          if not all(re.fullmatch(re.escape(os.environ["IMAGE"]) + r"@sha256:[a-f0-9]{64}", ref) for ref in refs):
              raise SystemExit("invalid platform digest reference")
          subprocess.run(["docker", "buildx", "imagetools", "create", "-t",
                          os.environ["IMAGE"] + ":" + os.environ["CANDIDATE_ID"], *refs], check=True)
          PY
          docker buildx imagetools inspect "$IMAGE:$CANDIDATE_ID" --raw > manifest.json
          python - <<'PY'
          import json
          import pathlib

          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          entries = manifest.get("manifests", [])
          actual = {(m["platform"]["os"], m["platform"]["architecture"]) for m in entries}
          if len(entries) != 2 or actual != {("linux", "amd64"), ("linux", "arm64")}:
              raise SystemExit(f"unexpected multi-platform index: {actual!r}")
          expected = {(pathlib.Path("digests") / f"{arch}.txt").read_text().strip().split("@", 1)[1]
                      for arch in ("amd64", "arm64")}
          if {m["digest"] for m in entries} != expected:
              raise SystemExit("index does not reference the inspected image digests")
          PY
      - name: Publish inspected multi-platform index
        env:
          IMAGE: ghcr.io/thewhitewater/tube-bridge
          CANDIDATE_ID: rc-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Resolve once, then promote the same immutable index to all release tags.
          digest=$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE_ID" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          args=()
          while IFS= read -r tag; do
            test -n "$tag" || continue
            args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            actual=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$digest"
          done <<< "$RELEASE_TAGS"

  github-release:
    needs:
      - publish-pypi
      - publish-container
      - publish-mcp-registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-plugin-preview
          path: plugin-dist/
      - name: Generate public artifact checksums
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          (cd plugin-dist && sha256sum *) >> SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*
            plugin-dist/*
            SHA256SUMS
