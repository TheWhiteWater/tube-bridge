[project]
name = "tube-bridge"
version = "1.0.0"
description = "Tube Bridge — YouTube MCP server for AI agents. 16 tools: search, transcripts, semantic corpus, comments. Zero keys + optional API v3."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "sqlite-vec>=0.1.0",
    "fastembed>=0.8.0",
]

[project.scripts]
tube-bridge = "server:main"
