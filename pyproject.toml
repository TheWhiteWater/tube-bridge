[project]
name = "tube-bridge"
version = "1.0.0"
description = "Tube Bridge — YouTube MCP server for AI agents. Search, discovery, transcripts. Zero API keys, optional Data API v3 upgrade."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=1.0.0",
]

[project.scripts]
yt-mcp = "server:main"
