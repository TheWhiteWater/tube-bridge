schema: tube-bridge.research-artifact.v1
artifact_id: <generated-by-tube-bridge>
template_id: corpus-study-v1
template_version: 1
revision: 1
status: draft

field_ownership:
  machine_fields: tube_bridge_read_only
  agent_fields: user_or_agent_editable

machine_fields:
  target:
    type: corpus
    corpus_id: <auto-filled>
    requested_source_artifact_ids: []

  corpus_snapshot:
    corpus_id: <auto-filled>
    label: <auto-filled>
    embedding_model: <auto-filled>
    created_at: <auto-filled>
    chunk_count: <auto-filled>
    source_count: <auto-filled>

  # One machine-filled row per corpus video. No research classification appears
  # here.
  sources:
    - video_id: <auto-filled>
      canonical_url: <auto-filled>
      title: <auto-filled>
      channel_id: <auto-filled-or-null>
      channel_name: <auto-filled-from-source-artifact-or-cache-or-null>
      channel_url: <auto-filled-from-source-artifact-or-cache-or-null>
      channel_description: <auto-filled-from-attached-source-artifact-or-null>
      channel_metadata_provider: <youtube-data-api|yt-dlp|video-metadata-fallback|null>
      source_selection_status: <selected_explicit|selected_single|ambiguous|unavailable>
      available_source_artifacts:
        - artifact_id: <structured-source-artifact-id>
          revision: <integer>
          transcript_status: <ready|unavailable|unknown>
          transcript_version_id: <transcript-version-id-or-null>
          source_sha256: <hash-or-null>
          selected_language: <language-or-null>
          track_kind: <manual|generated|null>
      channel_context_artifact_id: <structured-source-artifact-id-or-null>
      structured_source_artifact_id: <structured-source-artifact-id-or-null>
      source_reference:
        transcript_version_id: <auto-filled-or-null>
        source_sha256: <auto-filled-or-null>
        segments:
          - segment_id: <stable-source-segment-id>
            start_ms: <integer>
            end_ms: <integer>
      description: <auto-filled-video-description-from-cache-or-null>
      metadata_retrieval_mode: <cache|unavailable>
      cached_transcript_available: <true|false>
      transcript_status: <ready|unavailable|ambiguous|unknown>
      selected_language: <auto-filled-from-selected-artifact-or-null>
      track_kind: <manual|generated|null>
      added_at: <auto-filled>

  retrieval_summary:
    metadata_unavailable_video_ids: []
    transcript_unknown_video_ids: []
    ambiguous_source_video_ids: []

agent_fields:
  research_frame:
    completion: unfilled
    question: null
    scope: null
    inclusion_rule: null
    exclusion_rule: null
    time_boundary: null
    language_boundary: null
    stop_rule: null
    custom_fields: {}

  metadata_annotation:
    completion: unfilled
    corpus_summary: null
    broad_tags: []
    custom_fields: {}

  channel_groups:
    completion: unfilled
    groups: []
    group_shape:
      group_id: <agent-local-id>
      label: <agent-authored-label>
      channel_ids: []
      tags: []
      rationale: null
      confidence: unknown
      evidence_refs: []

  duplicate_and_lineage:
    completion: unfilled
    clusters: []
    cluster_shape:
      cluster_id: <agent-local-id>
      relation_type: <near_duplicate|syndication|shared_origin|restatement|unknown>
      source_refs: []
      rationale: null
      confidence: unknown
      evidence_refs: []

  codebook:
    completion: unfilled
    codes: []
    code_shape:
      code_id: <agent-local-id>
      label: <agent-authored-label>
      definition: null
      parent_code_id: null
      aliases: []

  coding_rows:
    completion: unfilled
    rows: []
    row_shape:
      row_id: <agent-local-id>
      video_id: <video-id>
      transcript_version_id: <transcript-version-id>
      first_segment_id: <segment-id>
      last_segment_id: <segment-id>
      start_ms: <integer>
      end_ms: <integer>
      code_ids: []
      quotation: null
      context_before: null
      context_after: null
      agent_note: null
      confidence: unknown

  evidence_ledger:
    completion: unfilled
    entries: []
    entry_shape:
      evidence_id: <agent-local-id>
      source_refs: []
      observation: null
      interpretation: null
      confidence: unknown

  synthesis:
    completion: unfilled
    summary: null
    limitations: []
    unresolved_questions: []
    custom_fields: {}

agent_provenance:
  author_type: null
  author_name: null
  model: null
  method: null
  created_at: null

validation:
  machine_fields_unchanged: true
  agent_payload_schema_valid: false
  all_source_refs_exist: false
  all_segment_ranges_valid: false
  exportable_coding_rows: false
  validated_at: null
